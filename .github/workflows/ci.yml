name: Node CI

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install packages
        run: yarn install --frozen-lockfile

      - name: Run all checks
        run: yarn run check:all
